services:
  - type: web
    name: soul7os-agent
    env: python
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    plan: starter
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PORT
        value: 10000
